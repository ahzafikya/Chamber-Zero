<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quadro Bro's</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}


/* =========================
   CAMERA
========================= */

.camera {
    position: absolute;
    inset: 0;

    transform-origin: 50% 50%;
    transform: scale(1);

    transition:
        transform 3s cubic-bezier(.65,0,.15,1);

    z-index: 1;
}


/* =========================
   BUILDING
========================= */

.building {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            #111 0%,
            #292929 20%,
            #3b3b3b 50%,
            #252525 80%,
            #101010 100%
        );

    box-shadow:
        inset 0 0 180px #000;
}


/* =========================
   FLOOR
========================= */

.ground {
    position: absolute;

    left: -10%;
    bottom: -10%;

    width: 120%;
    height: 55%;

    background:
        linear-gradient(
            to bottom,
            #171717,
            #080808 70%,
            #000
        );

    transform:
        perspective(600px)
        rotateX(62deg);

    transform-origin: bottom;
}


/* =========================
   ENTRANCE
========================= */

.entrance {
    position: absolute;

    width: 430px;
    height: 530px;

    left: 50%;
    top: 16%;

    transform: translateX(-50%);

    background: #050505;

    box-shadow:
        0 0 80px #000,
        inset 0 0 40px #000;

    overflow: hidden;
}


/* =========================
   DOORS
========================= */

.door {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #111,
            #292929,
            #151515
        );

    border: 2px solid #080808;

    transition:
        transform 1.4s cubic-bezier(.7,0,.2,1);

    z-index: 5;
}

.door.left {
    left: 0;

    transform-origin: left center;
}

.door.right {
    right: 0;

    transform-origin: right center;
}


/* DOOR PANELS */

.door::before,
.door::after {
    content: "";

    position: absolute;

    left: 12%;
    right: 12%;

    border: 2px solid #050505;

    background:
        linear-gradient(
            135deg,
            #222,
            #111
        );
}

.door::before {
    top: 10%;
    height: 35%;
}

.door::after {
    bottom: 10%;
    height: 35%;
}


/* HANDLES */

.handle {
    position: absolute;

    top: 50%;

    width: 13px;
    height: 55px;

    transform: translateY(-50%);

    background: #777;

    border-radius: 5px;

    box-shadow:
        0 0 10px #aaa;
}

.left .handle {
    right: 15px;
}

.right .handle {
    left: 15px;
}


/* OPEN */

.entrance.doors-open .left {
    transform:
        perspective(900px)
        rotateY(-110deg);
}

.entrance.doors-open .right {
    transform:
        perspective(900px)
        rotateY(110deg);
}


/* =========================
   EFFECTS
========================= */

.effects {
    position: absolute;
    inset: 0;

    z-index: 100;

    pointer-events: none;
}


/* =========================
   BOX
========================= */

.box {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 110px;
    height: 110px;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 110;
}


/* TOP */

.box-top {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #222,
            #050505
        );

    border-radius:
        14px 14px 0 0;

    border:
        3px solid #000;
}


/* BOTTOM */

.box-bottom {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #eee,
            #999
        );

    border-radius:
        0 0 14px 14px;

    border:
        3px solid #000;
}


/* BUTTON */

.button {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 32px;
    height: 32px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #aaa;

    border: 5px solid #333;

    box-shadow:
        inset 0 0 8px #fff,
        0 0 12px #000;

    z-index: 10;
}


/* APPEAR */

.box.appear {
    opacity: 1;

    animation:
        boxAppear .7s
        cubic-bezier(.2,1.4,.4,1)
        forwards;
}

@keyframes boxAppear {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0);
    }

    70% {
        transform:
            translate(-50%, -50%)
            scale(1.15);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

}


/* =========================
   EXACTLY 3 SHAKES
========================= */

.box.shake1 {
    animation:
        shakeOne .32s ease-in-out;
}

.box.shake2 {
    animation:
        shakeTwo .32s ease-in-out;
}

.box.shake3 {
    animation:
        shakeThree .32s ease-in-out;
}


@keyframes shakeOne {

    0%,100% {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    25% {
        transform:
            translate(calc(-50% - 10px), -50%)
            rotate(-5deg);
    }

    50% {
        transform:
            translate(calc(-50% + 10px), -50%)
            rotate(5deg);
    }

    75% {
        transform:
            translate(calc(-50% - 7px), -50%)
            rotate(-3deg);
    }

}


@keyframes shakeTwo {

    0%,100% {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    25% {
        transform:
            translate(calc(-50% + 11px), -50%)
            rotate(5deg);
    }

    50% {
        transform:
            translate(calc(-50% - 11px), -50%)
            rotate(-5deg);
    }

    75% {
        transform:
            translate(calc(-50% + 7px), -50%)
            rotate(3deg);
    }

}


@keyframes shakeThree {

    0%,100% {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    25% {
        transform:
            translate(calc(-50% - 12px), -50%)
            rotate(-6deg);
    }

    50% {
        transform:
            translate(calc(-50% + 12px), -50%)
            rotate(6deg);
    }

    75% {
        transform:
            translate(calc(-50% - 6px), -50%)
            rotate(-3deg);
    }

}


/* =========================
   STAR CANVAS
========================= */

#starCanvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 120;

    pointer-events: none;
}

</style>
</head>


<body>

<div class="scene">

    <div class="camera">

        <div class="building"></div>

        <div class="ground"></div>

        <div class="entrance" id="entrance">

            <div class="door left">
                <div class="handle"></div>
            </div>

            <div class="door right">
                <div class="handle"></div>
            </div>

        </div>

    </div>


    <div class="effects">

        <div class="box" id="box">

            <div class="box-top"></div>

            <div class="box-bottom"></div>

            <div class="button"></div>

        </div>

        <canvas id="starCanvas"></canvas>

    </div>

</div>


<script>

const camera =
    document.querySelector(".camera");

const entrance =
    document.querySelector("#entrance");

const box =
    document.querySelector("#box");

const canvas =
    document.querySelector("#starCanvas");

const ctx =
    canvas.getContext("2d");


let width =
    window.innerWidth;

let height =
    window.innerHeight;


canvas.width = width;
canvas.height = height;


/* =========================
   STAR SETTINGS
========================= */

const STAR_COUNT = 450;

const stars = [];


/* =========================
   CREATE PERFECT TEXT SHAPE
========================= */

function createTextTargets() {

    const textCanvas =
        document.createElement("canvas");

    const textCtx =
        textCanvas.getContext("2d");


    /*
       Give the text canvas lots of
       empty space so NOTHING gets
       clipped.
    */

    textCanvas.width = width;
    textCanvas.height = height;


    /*
       Responsive font.
       Much smaller than before.
    */

    let fontSize =
        Math.min(
            width * 0.075,
            100
        );


    textCtx.font =
        `900 ${fontSize}px Arial`;

    textCtx.textAlign =
        "center";

    textCtx.textBaseline =
        "middle";

    textCtx.fillStyle =
        "#fff";


    textCtx.fillText(
        "Quadro Bro's",
        width / 2,
        height / 2
    );


    const image =
        textCtx.getImageData(
            0,
            0,
            width,
            height
        );


    const pixels =
        image.data;


    const points = [];


    /*
       Sample the ENTIRE canvas,
       not just the upper part.
    */

    for (
        let y = 0;
        y < height;
        y += 4
    ) {

        for (
            let x = 0;
            x < width;
            x += 4
        ) {

            const index =
                (y * width + x) * 4;


            const alpha =
                pixels[index + 3];


            if (alpha > 180) {

                points.push({
                    x,
                    y
                });

            }

        }

    }


    /*
       Shuffle points so stars
       spread through every letter.
    */

    for (
        let i = points.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            points[i],
            points[j]
        ] =
        [
            points[j],
            points[i]
        ];

    }


    /*
       Return positions centered
       around screen center.
    */

    return points.map(point => ({

        x:
            point.x - width / 2,

        y:
            point.y - height / 2

    }));

}


/* =========================
   CREATE STARS
========================= */

let targets =
    createTextTargets();


function createStars() {

    stars.length = 0;


    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            100 +
            Math.random() * 450;


        const target =
            targets[
                i % targets.length
            ];


        stars.push({

            explosionX:
                Math.cos(angle) *
                distance,

            explosionY:
                Math.sin(angle) *
                distance,

            targetX:
                target.x,

            targetY:
                target.y,

            size:
                1.5 +
                Math.random() * 2.2

        });

    }

}


createStars();


/* =========================
   STAR DRAWING
========================= */

function drawStar(
    x,
    y,
    size
) {

    ctx.beginPath();


    ctx.moveTo(
        x,
        y - size * 2
    );

    ctx.lineTo(
        x + size * .45,
        y - size * .45
    );

    ctx.lineTo(
        x + size * 2,
        y
    );

    ctx.lineTo(
        x + size * .45,
        y + size * .45
    );

    ctx.lineTo(
        x,
        y + size * 2
    );

    ctx.lineTo(
        x - size * .45,
        y + size * .45
    );

    ctx.lineTo(
        x - size * 2,
        y
    );

    ctx.lineTo(
        x - size * .45,
        y - size * .45
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================
   STAR ANIMATION
========================= */

let animationStart = 0;

let animationRunning = false;


function startExplosion() {

    animationRunning = true;

    animationStart =
        performance.now();

    requestAnimationFrame(
        animateStars
    );

}


function animateStars(now) {

    if (!animationRunning)
        return;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const elapsed =
        now - animationStart;


    /*
       PHASE 1
       Explosion
       0 → 1.2 seconds
    */

    if (elapsed < 1200) {

        const progress =
            elapsed / 1200;


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        ctx.fillStyle = "#fff";


        for (const star of stars) {

            const x =
                width / 2 +
                star.explosionX *
                eased;


            const y =
                height / 2 +
                star.explosionY *
                eased;


            drawStar(
                x,
                y,
                star.size
            );

        }

    }


    /*
       PHASE 2
       EXACTLY 2 SECOND WAIT
    */

    else if (elapsed < 3200) {

        ctx.fillStyle = "#fff";


        for (const star of stars) {

            const x =
                width / 2 +
                star.explosionX;


            const y =
                height / 2 +
                star.explosionY;


            drawStar(
                x,
                y,
                star.size
            );

        }

    }


    /*
       PHASE 3
       FORM QUADRO BRO'S
    */

    else {

        const formElapsed =
            elapsed - 3200;


        const duration =
            2500;


        let progress =
            Math.min(
                formElapsed /
                duration,
                1
            );


        /*
           Smooth movement
        */

        const eased =
            progress *
            progress *
            (3 - 2 * progress);


        ctx.fillStyle = "#fff";


        for (const star of stars) {

            const startX =
                width / 2 +
                star.explosionX;


            const startY =
                height / 2 +
                star.explosionY;


            const targetX =
                width / 2 +
                star.targetX;


            const targetY =
                height / 2 +
                star.targetY;


            const x =
                startX +
                (targetX - startX) *
                eased;


            const y =
                startY +
                (targetY - startY) *
                eased;


            drawStar(
                x,
                y,
                star.size
            );

        }

    }


    requestAnimationFrame(
        animateStars
    );

}


/* =========================
   TIMELINE
========================= */


/*
   Camera zoom
*/

setTimeout(() => {

    camera.style.transform =
        "scale(3.2)";

}, 300);


/*
   Doors open
*/

setTimeout(() => {

    entrance.classList.add(
        "doors-open"
    );

}, 2300);


/*
   Box appears
*/

setTimeout(() => {

    box.classList.add(
        "appear"
    );

}, 3600);


/*
   SHAKE 1
*/

setTimeout(() => {

    box.classList.remove(
        "appear"
    );

    box.style.opacity = "1";

    void box.offsetWidth;

    box.classList.add(
        "shake1"
    );

}, 4500);


/*
   SHAKE 2
*/

setTimeout(() => {

    box.classList.remove(
        "shake1"
    );

    void box.offsetWidth;

    box.classList.add(
        "shake2"
    );

}, 5100);


/*
   SHAKE 3
*/

setTimeout(() => {

    box.classList.remove(
        "shake2"
    );

    void box.offsetWidth;

    box.classList.add(
        "shake3"
    );

}, 5700);


/*
   BURST
*/

setTimeout(() => {

    box.style.opacity = "0";

    startExplosion();

}, 6100);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        width =
            window.innerWidth;

        height =
            window.innerHeight;


        canvas.width = width;
        canvas.height = height;


        targets =
            createTextTargets();


        stars.forEach(
            (star, i) => {

                const target =
                    targets[
                        i % targets.length
                    ];


                star.targetX =
                    target.x;

                star.targetY =
                    target.y;

            }
        );

    }
);

</script>

</body>
</html>
