<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadro Bro's</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #111;
}

/* CAMERA */
.camera {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    transform: scale(1);
    transition: transform 3s cubic-bezier(.65,0,.2,1);
}

/* BUILDING */
.building {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 82%;
    background: linear-gradient(#292929, #111);
    border-bottom: 12px solid #090909;
}

.building::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .12;
    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 9px,
            #aaa 10px,
            transparent 11px
        );
}

/* GROUND */
.ground {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 22%;
    background: linear-gradient(#171717, #050505);
}

/* ENTRANCE */
.entrance {
    position: absolute;
    left: 50%;
    top: 15%;
    width: 420px;
    height: 520px;
    transform: translateX(-50%);
    background: #050505;
    box-shadow:
        0 0 40px #000,
        inset 0 0 30px #000;
}

/* DOORS */
.door {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, #252525, #090909);
    border: 5px solid #303030;
    z-index: 5;
    transition: transform 2s cubic-bezier(.7,0,.2,1);
}

.door.left {
    left: 0;
    transform-origin: left center;
}

.door.right {
    right: 0;
    transform-origin: right center;
}

.doors-open .door.left {
    transform: perspective(700px) rotateY(-105deg);
}

.doors-open .door.right {
    transform: perspective(700px) rotateY(105deg);
}

/* HANDLES */
.handle {
    position: absolute;
    top: 50%;
    width: 12px;
    height: 55px;
    background: #777;
    border-radius: 5px;
}

.left .handle {
    right: 15px;
}

.right .handle {
    left: 15px;
}

/* BOX */
.box {
    position: absolute;

    /* CENTER OF SCREEN */
    left: 50%;
    top: 70%;

    width: 100px;
    height: 100px;

    transform: translate(-50%, -50%) scale(0);

    z-index: 50;
    display: none;
}

.box-top {
    position: absolute;
    top: 0;
    width: 100%;
    height: 50%;
    background: #080808;
    border: 4px solid #555;
}

.box-bottom {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: #eee;
    border: 4px solid #555;
}

.button {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 25px;
    height: 25px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #888;
    border: 4px solid #444;
    z-index: 2;
}

/* BOX SPAWN */
.box.spawn {
    display: block;
    animation: boxSpawn .6s ease-out forwards;
}

@keyframes boxSpawn {
    from {
        transform: translate(-50%, -50%) scale(0);
    }

    to {
        transform: translate(-50%, -50%) scale(1);
    }
}

/* SHAKES */
.box.shake1 {
    animation: shake1 .22s ease-in-out;
}

.box.shake2 {
    animation: shake2 .22s ease-in-out;
}

.box.shake3 {
    animation: shake3 .22s ease-in-out;
}

@keyframes shake1 {
    0%,100% {
        transform: translate(-50%, -50%) rotate(0);
    }

    25% {
        transform: translate(calc(-50% - 9px), -50%) rotate(-5deg);
    }

    75% {
        transform: translate(calc(-50% + 9px), -50%) rotate(5deg);
    }
}

@keyframes shake2 {
    0%,100% {
        transform: translate(-50%, -50%) rotate(0);
    }

    25% {
        transform: translate(calc(-50% - 12px), -50%) rotate(-7deg);
    }

    75% {
        transform: translate(calc(-50% + 12px), -50%) rotate(7deg);
    }
}

@keyframes shake3 {
    0%,100% {
        transform: translate(-50%, -50%) rotate(0);
    }

    25% {
        transform: translate(calc(-50% - 15px), -50%) rotate(-9deg);
    }

    75% {
        transform: translate(calc(-50% + 15px), -50%) rotate(9deg);
    }
}

/* STARS */
.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 60;
}

.star {
    position: absolute;

    width: 7px;
    height: 7px;

    left: 50%;
    top: 70%;

    opacity: 0;

    background: white;

    clip-path: polygon(
        50% 0%,
        61% 39%,
        100% 50%,
        61% 61%,
        50% 100%,
        39% 61%,
        0% 50%,
        39% 39%
    );

    transform: translate(-50%, -50%);
}

/* EXPLOSION */
.star.explode {
    animation: explode 1s cubic-bezier(.1,.8,.2,1) forwards;
}

@keyframes explode {

    0% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(.3);
    }

    100% {
        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--explode-x)),
                calc(-50% + var(--explode-y))
            )
            scale(1);
    }
}

/* FORM WORD */
.star.form {
    animation:
        formWord 1.8s cubic-bezier(.7,0,.2,1)
        forwards;
}

@keyframes formWord {

    from {
        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--explode-x)),
                calc(-50% + var(--explode-y))
            )
            scale(1);
    }

    to {
        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--target-x)),
                calc(-50% + var(--target-y))
            )
            scale(.9);
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="camera">

        <div class="building"></div>

        <div class="ground"></div>

        <div class="entrance">

            <div class="door left">
                <div class="handle"></div>
            </div>

            <div class="door right">
                <div class="handle"></div>
            </div>

        </div>

        <!-- SQUARE BOX -->
        <div class="box" id="box">

            <div class="box-top"></div>

            <div class="box-bottom"></div>

            <div class="button"></div>

        </div>

        <div class="stars" id="stars"></div>

    </div>

</div>

<script>

/* =====================================
   SETTINGS
===================================== */

const STAR_COUNT = 900;

const camera =
    document.querySelector(".camera");

const entrance =
    document.querySelector(".entrance");

const box =
    document.querySelector("#box");

const starsContainer =
    document.querySelector("#stars");


/* =====================================
   FULL ZOOM TO DOOR
===================================== */

setTimeout(() => {

    camera.style.transform =
        "scale(2.8)";

}, 300);


/* =====================================
   OPEN DOORS
===================================== */

setTimeout(() => {

    entrance.classList.add(
        "doors-open"
    );

}, 1300);


/* =====================================
   CREATE TEXT PIXELS
===================================== */

const canvas =
    document.createElement("canvas");

const ctx =
    canvas.getContext("2d");

canvas.width =
    window.innerWidth;

canvas.height =
    window.innerHeight;

ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
);

const fontSize =
    Math.min(
        window.innerWidth * 0.13,
        150
    );

ctx.font =
    `900 ${fontSize}px Arial`;

ctx.textAlign =
    "center";

ctx.textBaseline =
    "middle";

ctx.fillStyle =
    "white";

ctx.fillText(
    "Quadro Bro's",
    canvas.width / 2,
    canvas.height / 2
);


/* =====================================
   GET REAL LETTER PIXELS
===================================== */

const imageData =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

const pixels = [];

for (
    let y = 0;
    y < canvas.height;
    y += 4
) {

    for (
        let x = 0;
        x < canvas.width;
        x += 4
    ) {

        const index =
            (y * canvas.width + x) * 4;

        const alpha =
            imageData.data[index + 3];

        if (alpha > 100) {

            pixels.push({

                x:
                    x -
                    canvas.width / 2,

                y:
                    y -
                    canvas.height / 2

            });

        }

    }

}


/* =====================================
   CREATE STARS
===================================== */

const stars = [];

for (
    let i = 0;
    i < STAR_COUNT;
    i++
) {

    const star =
        document.createElement("div");

    star.className =
        "star";


    /* ACTUAL LETTER PIXEL */

    const target =
        pixels[
            i % pixels.length
        ];


    star.style.setProperty(
        "--target-x",
        `${target.x}px`
    );

    star.style.setProperty(
        "--target-y",
        `${target.y}px`
    );


    /* RANDOM EXPLOSION */

    const angle =
        Math.random() *
        Math.PI *
        2;

    const distance =
        150 +
        Math.random() * 500;

    const explodeX =
        Math.cos(angle) *
        distance;

    const explodeY =
        Math.sin(angle) *
        distance;


    star.style.setProperty(
        "--explode-x",
        `${explodeX}px`
    );

    star.style.setProperty(
        "--explode-y",
        `${explodeY}px`
    );


    starsContainer.appendChild(
        star
    );

    stars.push(star);
}


/* =====================================
   BOX SPAWN
===================================== */

setTimeout(() => {

    box.classList.add(
        "spawn"
    );

}, 3000);


/* =====================================
   SHAKE 1
===================================== */

setTimeout(() => {

    box.className =
        "box shake1";

}, 3800);


/* =====================================
   SHAKE 2
===================================== */

setTimeout(() => {

    box.className =
        "box shake2";

}, 4400);


/* =====================================
   SHAKE 3
===================================== */

setTimeout(() => {

    box.className =
        "box shake3";

}, 5000);


/* =====================================
   BURST
===================================== */

setTimeout(() => {

    box.style.display =
        "none";

    stars.forEach(
        (star, i) => {

            setTimeout(() => {

                star.classList.add(
                    "explode"
                );

            }, Math.random() * 120);

        }
    );

}, 5400);


/* =====================================
   2 SECOND WAIT
   THEN FORM WORD
===================================== */

setTimeout(() => {

    stars.forEach(
        (star, i) => {

            setTimeout(() => {

                star.classList.remove(
                    "explode"
                );

                star.classList.add(
                    "form"
                );

            }, Math.random() * 450);

        }
    );

}, 7400);

</script>

</body>
</html>
