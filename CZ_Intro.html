<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quadro Bro's</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}


/* =====================================================
   CAMERA
===================================================== */

.camera {
    position: absolute;
    inset: 0;

    transform-origin: 50% 50%;

    transform: scale(1);

    transition:
        transform 3s cubic-bezier(.65,0,.15,1);

    z-index: 1;
}


/* =====================================================
   BUILDING
===================================================== */

.building {
    position: absolute;

    width: 100%;
    height: 85%;

    left: 0;
    top: 0;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border-bottom: 10px solid #080808;
}

.building::after {

    content: "";

    position: absolute;
    inset: 0;

    opacity: .10;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 10px,
            #aaa 11px,
            transparent 12px
        );
}


/* =====================================================
   GROUND
===================================================== */

.ground {

    position: absolute;

    width: 100%;
    height: 25%;

    bottom: 0;
    left: 0;

    background:
        linear-gradient(
            #181818,
            #050505
        );
}


/* =====================================================
   ENTRANCE
===================================================== */

.entrance {

    position: absolute;

    width: 430px;
    height: 530px;

    left: 50%;
    top: 16%;

    transform:
        translateX(-50%);

    background: #030303;

    box-shadow:
        0 0 60px #000,
        inset 0 0 40px #000;

    z-index: 5;
}


/* =====================================================
   DOORS
===================================================== */

.door {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            135deg,
            #292929,
            #080808
        );

    border: 5px solid #383838;

    transition:
        transform 2s
        cubic-bezier(.7,0,.15,1);

    z-index: 10;
}

.door.left {

    left: 0;

    transform-origin:
        left center;
}

.door.right {

    right: 0;

    transform-origin:
        right center;
}


/* =====================================================
   DOORS OPEN
===================================================== */

.doors-open .door.left {

    transform:
        perspective(900px)
        rotateY(-110deg);
}

.doors-open .door.right {

    transform:
        perspective(900px)
        rotateY(110deg);
}


/* =====================================================
   DOOR DETAILS
===================================================== */

.door::before {

    content: "";

    position: absolute;

    inset: 20px;

    border: 2px solid #444;
}

.handle {

    position: absolute;

    width: 12px;
    height: 55px;

    top: 50%;

    transform:
        translateY(-50%);

    background: #777;

    border-radius: 5px;
}

.left .handle {
    right: 15px;
}

.right .handle {
    left: 15px;
}


/* =====================================================
   EFFECT LAYER
===================================================== */

.effects {

    position: absolute;

    inset: 0;

    z-index: 100;

    pointer-events: none;
}


/* =====================================================
   SQUARE BOX
===================================================== */

.box {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 110px;
    height: 110px;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 110;
}


/* TOP */

.box-top {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 50%;

    background: #050505;

    border: 4px solid #555;
}


/* BOTTOM */

.box-bottom {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    background: #eee;

    border: 4px solid #555;
}


/* CENTER BUTTON */

.button {

    position: absolute;

    width: 28px;
    height: 28px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #888;

    border: 4px solid #444;

    z-index: 5;
}


/* =====================================================
   BOX APPEARS
===================================================== */

.box.appear {

    opacity: 1;

    animation:
        boxAppear
        .7s
        cubic-bezier(.2,.9,.2,1)
        forwards;
}

@keyframes boxAppear {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =====================================================
   THREE INDIVIDUAL SHAKES
===================================================== */

.box.shake1 {

    animation:
        shakeOne
        .32s
        ease-in-out;
}

.box.shake2 {

    animation:
        shakeTwo
        .32s
        ease-in-out;
}

.box.shake3 {

    animation:
        shakeThree
        .32s
        ease-in-out;
}


/* SHAKE 1 */

@keyframes shakeOne {

    0% {
        transform:
            translate(-50%, -50%);
    }

    20% {
        transform:
            translate(
                calc(-50% - 12px),
                -50%
            )
            rotate(-5deg);
    }

    40% {
        transform:
            translate(
                calc(-50% + 12px),
                -50%
            )
            rotate(5deg);
    }

    60% {
        transform:
            translate(
                calc(-50% - 9px),
                -50%
            )
            rotate(-4deg);
    }

    80% {
        transform:
            translate(
                calc(-50% + 6px),
                -50%
            )
            rotate(2deg);
    }

    100% {
        transform:
            translate(-50%, -50%);
    }
}


/* SHAKE 2 */

@keyframes shakeTwo {

    0% {
        transform:
            translate(-50%, -50%);
    }

    20% {
        transform:
            translate(
                calc(-50% - 17px),
                -50%
            )
            rotate(-8deg);
    }

    40% {
        transform:
            translate(
                calc(-50% + 17px),
                -50%
            )
            rotate(8deg);
    }

    60% {
        transform:
            translate(
                calc(-50% - 12px),
                -50%
            )
            rotate(-6deg);
    }

    80% {
        transform:
            translate(
                calc(-50% + 8px),
                -50%
            )
            rotate(4deg);
    }

    100% {
        transform:
            translate(-50%, -50%);
    }
}


/* SHAKE 3 */

@keyframes shakeThree {

    0% {
        transform:
            translate(-50%, -50%);
    }

    20% {
        transform:
            translate(
                calc(-50% - 23px),
                -50%
            )
            rotate(-11deg);
    }

    40% {
        transform:
            translate(
                calc(-50% + 23px),
                -50%
            )
            rotate(11deg);
    }

    60% {
        transform:
            translate(
                calc(-50% - 15px),
                -50%
            )
            rotate(-7deg);
    }

    80% {
        transform:
            translate(
                calc(-50% + 9px),
                -50%
            )
            rotate(4deg);
    }

    100% {
        transform:
            translate(-50%, -50%);
    }
}


/* =====================================================
   STAR CANVAS
===================================================== */

#starCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 120;

    pointer-events: none;
}

</style>
</head>


<body>


<div class="scene">


    <!-- ===============================================
         CAMERA WORLD
    ================================================ -->

    <div class="camera">

        <div class="building"></div>

        <div class="ground"></div>


        <div class="entrance" id="entrance">

            <div class="door left">

                <div class="handle"></div>

            </div>


            <div class="door right">

                <div class="handle"></div>

            </div>

        </div>

    </div>



    <!-- ===============================================
         EFFECTS
    ================================================ -->

    <div class="effects">


        <!-- SQUARE BOX -->

        <div class="box" id="box">

            <div class="box-top"></div>

            <div class="box-bottom"></div>

            <div class="button"></div>

        </div>


        <!-- ONE CANVAS = MUCH LESS LAG -->

        <canvas id="starCanvas"></canvas>


    </div>

</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const camera =
    document.querySelector(".camera");

const entrance =
    document.querySelector("#entrance");

const box =
    document.querySelector("#box");

const canvas =
    document.querySelector("#starCanvas");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   CANVAS SETUP
===================================================== */

let width =
    window.innerWidth;

let height =
    window.innerHeight;


canvas.width =
    width;

canvas.height =
    height;


/* =====================================================
   STAR SETTINGS
   MUCH LIGHTER THAN 1000 DOM ELEMENTS
===================================================== */

const STAR_COUNT = 650;

const stars = [];


/* =====================================================
   CREATE THE ACTUAL TEXT SHAPE
===================================================== */

function createTextTargets() {

    const textCanvas =
        document.createElement("canvas");

    const textCtx =
        textCanvas.getContext("2d");


    textCanvas.width =
        width;

    textCanvas.height =
        height;


    /*
       BIG, COMPLETE TEXT
    */

    const fontSize =
        Math.min(
            width * 0.115,
            135
        );


    textCtx.font =
        `900 ${fontSize}px Arial`;


    textCtx.textAlign =
        "center";


    textCtx.textBaseline =
        "middle";


    textCtx.fillStyle =
        "#fff";


    /*
       EXACT WORD
    */

    textCtx.fillText(
        "Quadro Bro's",
        width / 2,
        height / 2
    );


    const data =
        textCtx.getImageData(
            0,
            0,
            width,
            height
        ).data;


    const possibleTargets = [];


    /*
       Sample every 3 pixels.
       This captures the FULL letters.
    */

    for (
        let y = 0;
        y < height;
        y += 3
    ) {

        for (
            let x = 0;
            x < width;
            x += 3
        ) {

            const index =
                (y * width + x) * 4;


            if (
                data[index + 3] >
                120
            ) {

                possibleTargets.push({

                    x:
                        x -
                        width / 2,

                    y:
                        y -
                        height / 2

                });

            }

        }

    }


    return possibleTargets;
}


let targets =
    createTextTargets();


/* =====================================================
   CREATE STARS
===================================================== */

function createStars() {

    stars.length = 0;


    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;


        const distance =
            80 +
            Math.random() * 430;


        stars.push({

            /* Current position */

            x: width / 2,

            y: height / 2,


            /* Explosion destination */

            explosionX:
                Math.cos(angle) *
                distance,

            explosionY:
                Math.sin(angle) *
                distance,


            /* Letter destination */

            target:
                targets[
                    i % targets.length
                ],


            size:
                1.5 +
                Math.random() * 2.5,


            opacity: 0,

            phase: "hidden",

            progress: 0

        });

    }

}


createStars();


/* =====================================================
   DRAW STAR
===================================================== */

function drawStar(
    x,
    y,
    size,
    opacity
) {

    ctx.save();

    ctx.globalAlpha =
        opacity;

    ctx.translate(
        x,
        y
    );


    ctx.beginPath();

    ctx.moveTo(
        0,
        -size * 2
    );

    ctx.lineTo(
        size * .45,
        -size * .45
    );

    ctx.lineTo(
        size * 2,
        0
    );

    ctx.lineTo(
        size * .45,
        size * .45
    );

    ctx.lineTo(
        0,
        size * 2
    );

    ctx.lineTo(
        -size * .45,
        size * .45
    );

    ctx.lineTo(
        -size * 2,
        0
    );

    ctx.lineTo(
        -size * .45,
        -size * .45
    );

    ctx.closePath();

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   ANIMATION
===================================================== */

let animationRunning =
    false;

let animationStart =
    0;


/*
   Explosion starts at this time.
*/

function startExplosion() {

    animationRunning =
        true;

    animationStart =
        performance.now();

    requestAnimationFrame(
        animateStars
    );
}


/* =====================================================
   STAR ANIMATION LOOP
===================================================== */

function animateStars(now) {

    if (!animationRunning)
        return;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const elapsed =
        now -
        animationStart;


    /*
       PHASE 1:
       Stars explode for 1.2 seconds
    */

    if (elapsed < 1200) {

        const progress =
            Math.min(
                elapsed / 1200,
                1
            );


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        stars.forEach(
            star => {

                const x =
                    width / 2 +
                    star.explosionX *
                    eased;


                const y =
                    height / 2 +
                    star.explosionY *
                    eased;


                star.x = x;
                star.y = y;

                star.opacity = 1;


                drawStar(
                    x,
                    y,
                    star.size,
                    1
                );

            }
        );

    }


    /*
       PHASE 2:
       EXACT 2 SECOND WAIT
    */

    else if (
        elapsed < 3200
    ) {

        stars.forEach(
            star => {

                drawStar(
                    star.x,
                    star.y,
                    star.size,
                    1
                );

            }
        );

    }


    /*
       PHASE 3:
       STARS FORM THE WORD
    */

    else {

        const formTime =
            elapsed - 3200;


        const duration =
            2200;


        const progress =
            Math.min(
                formTime /
                duration,
                1
            );


        /*
           Smooth cinematic movement
        */

        const eased =
            progress *
            progress *
            (3 - 2 * progress);


        stars.forEach(
            star => {

                const startX =
                    width / 2 +
                    star.explosionX;


                const startY =
                    height / 2 +
                    star.explosionY;


                const targetX =
                    width / 2 +
                    star.target.x;


                const targetY =
                    height / 2 +
                    star.target.y;


                const x =
                    startX +
                    (
                        targetX -
                        startX
                    ) *
                    eased;


                const y =
                    startY +
                    (
                        targetY -
                        startY
                    ) *
                    eased;


                drawStar(
                    x,
                    y,
                    star.size,
                    1
                );

            }
        );

    }


    requestAnimationFrame(
        animateStars
    );
}


/* =====================================================
   1. FULL ZOOM
===================================================== */

setTimeout(() => {

    camera.style.transform =
        "scale(3.2)";

}, 300);


/* =====================================================
   2. DOORS OPEN
===================================================== */

setTimeout(() => {

    entrance.classList.add(
        "doors-open"
    );

}, 2300);


/* =====================================================
   3. BOX APPEARS
===================================================== */

setTimeout(() => {

    box.classList.add(
        "appear"
    );

}, 3600);


/* =====================================================
   4. SHAKE #1
===================================================== */

setTimeout(() => {

    box.classList.remove(
        "appear"
    );

    /*
       Keep opacity visible!
    */

    box.style.opacity = "1";

    box.classList.add(
        "shake1"
    );

}, 4500);


/* =====================================================
   5. SHAKE #2
===================================================== */

setTimeout(() => {

    box.classList.remove(
        "shake1"
    );

    void box.offsetWidth;

    box.classList.add(
        "shake2"
    );

}, 5100);


/* =====================================================
   6. SHAKE #3
===================================================== */

setTimeout(() => {

    box.classList.remove(
        "shake2"
    );

    void box.offsetWidth;

    box.classList.add(
        "shake3"
    );

}, 5700);


/* =====================================================
   7. BURST
===================================================== */

setTimeout(() => {

    /*
       Box disappears exactly when
       the stars come from it.
    */

    box.style.opacity =
        "0";


    startExplosion();

}, 6100);


/* =====================================================
   RESIZE SUPPORT
===================================================== */

window.addEventListener(
    "resize",
    () => {

        width =
            window.innerWidth;

        height =
            window.innerHeight;


        canvas.width =
            width;

        canvas.height =
            height;


        targets =
            createTextTargets();


        stars.forEach(
            (star, i) => {

                star.target =
                    targets[
                        i %
                        targets.length
                    ];

            }
        );

    }
);

</script>

</body>
</html>
