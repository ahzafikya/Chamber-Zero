<!DOCTYPE html>
<html>
<head>
<title>Quadro Bro's</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #101010;
}

/* BUILDING */

.building {
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 2px,
            transparent 2px,
            transparent 8px
        ),
        linear-gradient(
            90deg,
            #141414,
            #292929 50%,
            #111111
        );

    box-shadow: inset 0 0 120px #000;
}

/* GROUND */

.ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 37%;

    background:
        repeating-linear-gradient(
            110deg,
            transparent 0px,
            transparent 75px,
            rgba(255,255,255,.025) 77px,
            transparent 79px
        ),
        repeating-linear-gradient(
            15deg,
            transparent 0px,
            transparent 100px,
            rgba(255,255,255,.02) 102px,
            transparent 104px
        ),
        #0c0c0c;

    box-shadow: inset 0 25px 50px #000;
}

/* DOOR */

.entrance {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 440px;
    height: 600px;

    transform: translateX(-50%);
    perspective: 1400px;
}

.frame {
    position: absolute;
    inset: 0;

    background: #070707;
    border: 18px solid #090909;

    box-shadow:
        0 0 60px #000,
        inset 0 0 50px #000;
}

.inside {
    position: absolute;
    inset: 18px;

    background:
        radial-gradient(
            ellipse at center,
            #151515,
            #000 75%
        );
}

.door {
    position: absolute;

    top: 18px;
    bottom: 18px;

    width: 50%;

    background:
        linear-gradient(
            90deg,
            #3b3b3b,
            #171717 45%,
            #292929
        );

    border: 3px solid #080808;

    box-shadow:
        inset 0 0 30px #000,
        0 10px 30px #000;

    z-index: 5;

    transition:
        transform 1.8s cubic-bezier(.12,.72,.18,1);
}

.leftDoor {
    left: 0;
    transform-origin: left center;
}

.rightDoor {
    right: 0;
    transform-origin: right center;
}

.open .leftDoor {
    transform: rotateY(-100deg);
}

.open .rightDoor {
    transform: rotateY(100deg);
}

/* CAMERA */

.walkIn {
    animation: walkIn 2s ease-out forwards;
}

@keyframes walkIn {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.1);
    }
}

/* BOX */

.box {
    position: absolute;

    left: 50%;
    bottom: 85px;

    width: 170px;
    height: 170px;

    transform:
        translateX(-50%)
        scale(.3);

    opacity: 0;

    z-index: 20;

    box-shadow: 0 25px 50px #000;

    transition:
        opacity .7s,
        transform .7s;
}

.box.show {
    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}

.boxTop {
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #111,
            #000
        );

    border: 5px solid #555;
    border-bottom: 2px solid #222;
}

.boxBottom {
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #fff,
            #ccc
        );

    border: 5px solid #555;
    border-top: 0;
}

.button {
    position: absolute;

    width: 48px;
    height: 48px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #aaa,
            #555
        );

    border: 6px solid #222;
}

/* THREE SHAKES */

.box.shake {
    animation: shake .6s ease-in-out;
}

@keyframes shake {

    0% {
        transform: translateX(-50%) rotate(0);
    }

    20% {
        transform:
            translateX(calc(-50% - 14px))
            rotate(-5deg);
    }

    40% {
        transform:
            translateX(calc(-50% + 14px))
            rotate(5deg);
    }

    60% {
        transform:
            translateX(calc(-50% - 10px))
            rotate(-4deg);
    }

    80% {
        transform:
            translateX(calc(-50% + 7px))
            rotate(3deg);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(0);
    }
}

/* STARS */

.star {
    position: absolute;

    left: 50%;
    top: calc(100% - 170px);

    width: 6px;
    height: 6px;

    background: white;

    clip-path: polygon(
        50% 0%,
        62% 38%,
        100% 50%,
        62% 62%,
        50% 100%,
        38% 62%,
        0% 50%,
        38% 38%
    );

    opacity: 0;

    z-index: 30;

    --explodeX: 0px;
    --explodeY: 0px;

    --targetX: 0px;
    --targetY: 0px;
}

/* EXPLOSION */

.explode .star {
    opacity: 1;

    animation:
        explode 1.1s
        cubic-bezier(.1,.7,.2,1)
        forwards;
}

@keyframes explode {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.1);
    }

    100% {
        transform:
            translate(
                var(--explodeX),
                var(--explodeY)
            )
            scale(1.2);
    }
}

/* FORM ACTUAL WORD */

.formWord .star {

    animation:
        formWord 2.5s
        cubic-bezier(.15,.8,.2,1)
        forwards;
}

@keyframes formWord {

    0% {
        transform:
            translate(
                var(--explodeX),
                var(--explodeY)
            )
            scale(1.2);
    }

    100% {
        transform:
            translate(
                var(--targetX),
                var(--targetY)
            )
            scale(.9);
    }
}

</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="building"></div>

    <div class="ground"></div>

    <div class="entrance" id="entrance">

        <div class="frame"></div>

        <div class="inside"></div>

        <div class="door leftDoor"></div>

        <div class="door rightDoor"></div>

    </div>

    <div class="box" id="box">

        <div class="boxTop"></div>

        <div class="boxBottom"></div>

        <div class="button"></div>

    </div>

    <div id="stars"></div>

</div>


<script>

const scene =
    document.getElementById("scene");

const entrance =
    document.getElementById("entrance");

const box =
    document.getElementById("box");

const stars =
    document.getElementById("stars");


/* =========================================
   MAKE THE ACTUAL "QUADRO BRO'S" SHAPE
   ========================================= */

const canvas =
    document.createElement("canvas");

const ctx =
    canvas.getContext("2d");

canvas.width = 1000;
canvas.height = 250;

ctx.fillStyle = "white";

ctx.font =
    "bold 110px Arial";

ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
    "Quadro Bro's",
    500,
    125
);


/* Find the actual pixels of the letters */

const pixels =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    ).data;


/* Store positions */

const textPositions = [];


/*
   Every few pixels becomes a star.
   This creates the actual letter shapes.
*/

for (let y = 0; y < canvas.height; y += 5) {

    for (let x = 0; x < canvas.width; x += 5) {

        const index =
            (y * canvas.width + x) * 4;

        const alpha =
            pixels[index + 3];

        if (alpha > 150) {

            textPositions.push({
                x: x - 500,
                y: y - 125
            });

        }
    }
}


/* =========================================
   CREATE STARS
   ========================================= */

const starCount =
    Math.min(
        500,
        textPositions.length
    );


for (let i = 0; i < starCount; i++) {

    const star =
        document.createElement("div");

    star.className = "star";


    /* Random explosion */

    const angle =
        Math.random() * Math.PI * 2;

    const distance =
        100 + Math.random() * 450;

    const explodeX =
        Math.cos(angle) * distance;

    const explodeY =
        Math.sin(angle) * distance;


    star.style.setProperty(
        "--explodeX",
        explodeX + "px"
    );

    star.style.setProperty(
        "--explodeY",
        explodeY + "px"
    );


    /* ACTUAL LETTER POSITION */

    const target =
        textPositions[
            Math.floor(
                i *
                textPositions.length /
                starCount
            )
        ];


    /*
       Scale the text to fit
       nicely on the screen.
    */

    const scale = 0.8;

    star.style.setProperty(
        "--targetX",
        (target.x * scale) + "px"
    );

    star.style.setProperty(
        "--targetY",
        (target.y * scale) + "px"
    );


    stars.appendChild(star);
}


/* =========================================
   DOORS OPEN
   ========================================= */

setTimeout(() => {

    entrance.classList.add("open");

    scene.classList.add("walkIn");

}, 1000);


/* =========================================
   BOX APPEARS
   ========================================= */

setTimeout(() => {

    box.classList.add("show");

}, 2700);


/* =========================================
   SHAKE #1
   ========================================= */

setTimeout(() => {

    box.classList.add("shake");

}, 3600);


/* =========================================
   SHAKE #2
   ========================================= */

setTimeout(() => {

    box.classList.remove("shake");

    void box.offsetWidth;

    box.classList.add("shake");

}, 4400);


/* =========================================
   SHAKE #3
   ========================================= */

setTimeout(() => {

    box.classList.remove("shake");

    void box.offsetWidth;

    box.classList.add("shake");

}, 5200);


/* =========================================
   STAR EXPLOSION
   ========================================= */

setTimeout(() => {

    box.style.opacity = "0";

    stars.classList.add("explode");

}, 6000);


/* =========================================
   WAIT 2 SECONDS
   THEN FORM THE ACTUAL WORD
   ========================================= */

setTimeout(() => {

    stars.classList.add("formWord");

}, 8000);

</script>

</body>
</html>
