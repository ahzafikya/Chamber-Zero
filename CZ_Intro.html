<!DOCTYPE html>
<html>
<head>
<title>Quadro Bro's</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

/* ================= SCENE ================= */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #111;
}

/* ================= BUILDING ================= */

.building {
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 2px,
            transparent 2px,
            transparent 8px
        ),
        linear-gradient(
            90deg,
            #151515,
            #292929 50%,
            #111
        );

    box-shadow:
        inset 0 0 100px #000;
}

/* Wall details */

.building::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(255,255,255,.08),
            transparent 2%
        ),
        radial-gradient(
            circle at 80% 40%,
            rgba(255,255,255,.06),
            transparent 2%
        );

    background-size: 180px 150px;
    opacity: .4;
}

/* ================= GROUND ================= */

.ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 36%;

    background:
        repeating-linear-gradient(
            105deg,
            transparent 0px,
            transparent 80px,
            rgba(255,255,255,.025) 82px,
            transparent 84px
        ),
        repeating-linear-gradient(
            15deg,
            transparent 0px,
            transparent 100px,
            rgba(255,255,255,.02) 102px,
            transparent 104px
        ),
        #0d0d0d;

    box-shadow:
        inset 0 20px 50px rgba(0,0,0,.9);
}

/* ================= DOORWAY ================= */

.entrance {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 440px;
    height: 600px;

    transform: translateX(-50%);

    perspective: 1400px;
}

/* Door frame */

.frame {
    position: absolute;
    inset: 0;

    background: #080808;

    border: 18px solid #0a0a0a;

    box-shadow:
        0 0 60px #000,
        inset 0 0 50px #000;
}

/* Dark room behind door */

.inside {
    position: absolute;

    left: 18px;
    right: 18px;
    top: 18px;
    bottom: 18px;

    background:
        radial-gradient(
            ellipse at center,
            #151515 0%,
            #000 75%
        );
}

/* ================= DOORS ================= */

.door {
    position: absolute;

    top: 18px;
    bottom: 18px;

    width: 50%;

    background:
        linear-gradient(
            90deg,
            #3a3a3a,
            #181818 45%,
            #2b2b2b
        );

    border: 3px solid #080808;

    box-shadow:
        inset 0 0 30px #000,
        0 10px 30px rgba(0,0,0,.8);

    z-index: 5;

    transition:
        transform 1.8s cubic-bezier(.12,.72,.18,1);
}

/* Door panels */

.door::after {
    content: "";

    position: absolute;
    inset: 25px;

    border: 2px solid #111;

    box-shadow:
        inset 0 0 20px #000;
}

.leftDoor {
    left: 0;
    transform-origin: left center;
}

.rightDoor {
    right: 0;
    transform-origin: right center;
}

/* Open */

.open .leftDoor {
    transform: rotateY(-100deg);
}

.open .rightDoor {
    transform: rotateY(100deg);
}

/* ================= WALK-IN CAMERA ================= */

/*
   Small zoom only.
   Keeps the ground visible.
*/

.scene.walkIn {
    animation: walkIn 2.2s ease-out forwards;
}

@keyframes walkIn {

    0% {
        transform: scale(1);
    }

    100% {
        transform: scale(1.12);
    }
}

/* ================= CHEST / BOX ================= */

.box {
    position: absolute;

    left: 50%;
    bottom: 85px;

    width: 170px;
    height: 170px;

    transform:
        translateX(-50%)
        scale(.3);

    opacity: 0;

    z-index: 20;

    box-shadow:
        0 25px 50px rgba(0,0,0,.9);

    transition:
        opacity .7s,
        transform .7s;
}

.box.show {
    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}

/* Black top */

.boxTop {
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #111,
            #000
        );

    border: 5px solid #555;
    border-bottom: 2px solid #222;
}

/* White bottom */

.boxBottom {
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #fff,
            #d0d0d0
        );

    border: 5px solid #555;
    border-top: 0;
}

/* Gray button */

.button {
    position: absolute;

    width: 48px;
    height: 48px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #aaa,
            #555
        );

    border: 6px solid #222;

    box-shadow:
        0 0 15px rgba(255,255,255,.25);
}

/* ================= EXACTLY 3 SHAKES ================= */

.box.shake {
    animation: shake .65s ease-in-out;
}

@keyframes shake {

    0% {
        transform: translateX(-50%) rotate(0);
    }

    20% {
        transform:
            translateX(calc(-50% - 15px))
            rotate(-5deg);
    }

    40% {
        transform:
            translateX(calc(-50% + 15px))
            rotate(5deg);
    }

    60% {
        transform:
            translateX(calc(-50% - 12px))
            rotate(-4deg);
    }

    80% {
        transform:
            translateX(calc(-50% + 8px))
            rotate(3deg);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(0);
    }
}

/* ================= STARS ================= */

.star {
    position: absolute;

    left: 50%;
    top: calc(100% - 170px);

    width: 7px;
    height: 7px;

    background: white;

    clip-path: polygon(
        50% 0%,
        62% 38%,
        100% 50%,
        62% 62%,
        50% 100%,
        38% 62%,
        0% 50%,
        38% 38%
    );

    opacity: 0;

    z-index: 30;

    --explodeX: 0px;
    --explodeY: 0px;

    --textX: 0px;
    --textY: 0px;
}

/* ================= STAR EXPLOSION ================= */

.explode .star {
    opacity: 1;

    animation:
        explodeStar 1s
        cubic-bezier(.1,.7,.2,1)
        forwards;
}

@keyframes explodeStar {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.1);
    }

    100% {
        transform:
            translate(
                var(--explodeX),
                var(--explodeY)
            )
            scale(1.3);
    }
}

/* ================= STARS FORM WORD ================= */

.formWord .star {

    animation:
        formWord 2.5s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes formWord {

    0% {
        transform:
            translate(
                var(--explodeX),
                var(--explodeY)
            )
            scale(1.3);
    }

    100% {
        transform:
            translate(
                var(--textX),
                var(--textY)
            )
            scale(.9);
    }
}

</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="building">

        <div style="
            position:absolute;
            width:70px;
            height:100px;
            left:8%;
            top:12%;
            background:#050505;
            border:4px solid #111;
        "></div>

        <div style="
            position:absolute;
            width:70px;
            height:100px;
            right:10%;
            top:20%;
            background:#050505;
            border:4px solid #111;
        "></div>

        <div style="
            position:absolute;
            width:70px;
            height:100px;
            left:18%;
            top:48%;
            background:#050505;
            border:4px solid #111;
        "></div>

    </div>


    <!-- BLACK CONCRETE GROUND -->

    <div class="ground"></div>


    <!-- DOOR -->

    <div class="entrance" id="entrance">

        <div class="frame"></div>

        <div class="inside"></div>

        <div class="door leftDoor"></div>

        <div class="door rightDoor"></div>

    </div>


    <!-- BOX -->

    <div class="box" id="box">

        <div class="boxTop"></div>

        <div class="boxBottom"></div>

        <div class="button"></div>

    </div>


    <!-- STARS -->

    <div id="stars"></div>

</div>


<script>

const scene =
    document.getElementById("scene");

const entrance =
    document.getElementById("entrance");

const box =
    document.getElementById("box");

const stars =
    document.getElementById("stars");


/* ================= CREATE STARS ================= */

const starCount = 140;

for (let i = 0; i < starCount; i++) {

    const star =
        document.createElement("div");

    star.className = "star";


    /* Random explosion direction */

    const angle =
        Math.random() * Math.PI * 2;

    const distance =
        150 + Math.random() * 400;

    const x =
        Math.cos(angle) * distance;

    const y =
        Math.sin(angle) * distance;

    star.style.setProperty(
        "--explodeX",
        x + "px"
    );

    star.style.setProperty(
        "--explodeY",
        y + "px"
    );


    /*
       Positions for the final
       "Quadro Bro's" shape
    */

    const textX =
        (Math.random() - 0.5) * 520;

    const textY =
        (Math.random() - 0.5) * 100;

    star.style.setProperty(
        "--textX",
        textX + "px"
    );

    star.style.setProperty(
        "--textY",
        textY + "px"
    );


    star.style.animationDelay =
        (Math.random() * .25) + "s";

    stars.appendChild(star);
}


/* ================= DOORS OPEN ================= */

setTimeout(() => {

    entrance.classList.add("open");

    /*
       Small camera movement.
       NOT a huge zoom.
    */

    scene.classList.add("walkIn");

}, 1000);


/* ================= BOX APPEARS ================= */

setTimeout(() => {

    box.classList.add("show");

}, 2700);


/* ================= SHAKE #1 ================= */

setTimeout(() => {

    box.classList.add("shake");

}, 3600);


/* ================= SHAKE #2 ================= */

setTimeout(() => {

    box.classList.remove("shake");

    void box.offsetWidth;

    box.classList.add("shake");

}, 4400);


/* ================= SHAKE #3 ================= */

setTimeout(() => {

    box.classList.remove("shake");

    void box.offsetWidth;

    box.classList.add("shake");

}, 5200);


/* ================= BURST ================= */

setTimeout(() => {

    /*
       Hide box
    */

    box.style.opacity = "0";


    /*
       Stars immediately
       burst OUT of the box.
    */

    stars.classList.add("explode");

}, 6000);


/* ================= WAIT 2 SECONDS ================= */

/*
   Exactly 2 seconds after
   the explosion, stars begin
   moving together.
*/

setTimeout(() => {

    stars.classList.add("formWord");

}, 8000);

</script>

</body>
</html>
