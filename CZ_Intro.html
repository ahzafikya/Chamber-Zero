<!DOCTYPE html>
<html>
<head>
    <title>Quadro Bro's</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

/* ================= SCENE ================= */

.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #080808;
}

/* ================= REALISTIC BUILDING ================= */

.building {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.45),
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.5)
        ),
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 2px,
            transparent 2px,
            transparent 7px
        ),
        linear-gradient(
            180deg,
            #303030 0%,
            #222 45%,
            #171717 100%
        );

    box-shadow:
        inset 0 0 120px #000;
}

/* Concrete wall texture */

.building::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .25;

    background:
        radial-gradient(
            circle at 20% 30%,
            #777 0,
            transparent 2%
        ),
        radial-gradient(
            circle at 70% 65%,
            #555 0,
            transparent 2%
        ),
        radial-gradient(
            circle at 45% 80%,
            #444 0,
            transparent 3%
        );

    background-size: 180px 150px;
}

/* ================= WINDOWS ================= */

.window {
    position: absolute;
    width: 70px;
    height: 100px;

    background:
        linear-gradient(
            135deg,
            #171717,
            #020202
        );

    border: 4px solid #111;

    box-shadow:
        inset 0 0 20px #000,
        0 5px 15px rgba(0,0,0,.7);
}

/* ================= CONCRETE GROUND ================= */

.ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34%;

    background:
        repeating-linear-gradient(
            105deg,
            transparent 0px,
            transparent 70px,
            rgba(255,255,255,.025) 72px,
            transparent 74px
        ),
        repeating-linear-gradient(
            15deg,
            transparent 0px,
            transparent 90px,
            rgba(255,255,255,.02) 92px,
            transparent 94px
        ),
        #101010;

    box-shadow:
        inset 0 20px 40px rgba(0,0,0,.8);
}

/* Concrete cracks */

.crack {
    position: absolute;
    height: 2px;
    background: #292929;
    transform-origin: left;
}

/* ================= ENTRANCE ================= */

.entrance {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 440px;
    height: 610px;

    transform: translateX(-50%);
    perspective: 1200px;
}

/* Entrance frame */

.frame {
    position: absolute;
    inset: 0;

    background: #090909;

    border:
        18px solid #0b0b0b;

    box-shadow:
        0 0 50px #000,
        inset 0 0 40px #000;
}

/* Darkness inside */

.inside {
    position: absolute;

    left: 18px;
    right: 18px;
    top: 18px;
    bottom: 18px;

    background:
        radial-gradient(
            ellipse at center,
            #111 0%,
            #020202 70%
        );
}

/* ================= DOORS ================= */

.door {
    position: absolute;

    bottom: 18px;
    top: 18px;

    width: 50%;

    background:
        linear-gradient(
            90deg,
            #363636,
            #181818 45%,
            #292929
        );

    border: 3px solid #080808;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.8),
        0 10px 20px rgba(0,0,0,.7);

    z-index: 5;

    transition:
        transform 1.7s cubic-bezier(.12,.75,.2,1);
}

/* Door panels */

.door::after {
    content: "";

    position: absolute;
    inset: 25px;

    border: 2px solid #111;

    box-shadow:
        inset 0 0 20px #000;
}

.leftDoor {
    left: 0;
    transform-origin: left center;
}

.rightDoor {
    right: 0;
    transform-origin: right center;
}

/* Doors open */

.open .leftDoor {
    transform: rotateY(-105deg);
}

.open .rightDoor {
    transform: rotateY(105deg);
}

/* ================= BOX ================= */

.box {
    position: absolute;

    left: 50%;
    bottom: 85px;

    width: 170px;
    height: 170px;

    transform:
        translateX(-50%)
        scale(.3);

    opacity: 0;

    z-index: 20;

    box-shadow:
        0 25px 40px rgba(0,0,0,.8);

    transition:
        opacity .7s,
        transform .7s;
}

.box.show {
    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}

/* Black top */

.boxTop {
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #111,
            #000
        );

    border:
        5px solid #555;

    border-bottom: 2px solid #222;
}

/* White bottom */

.boxBottom {
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #fff,
            #cfcfcf
        );

    border:
        5px solid #555;

    border-top: 0;
}

/* Gray button */

.button {
    position: absolute;

    width: 48px;
    height: 48px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #aaa,
            #555
        );

    border: 6px solid #222;

    box-shadow:
        0 0 15px rgba(255,255,255,.25);
}

/* ================= BOX SHAKE ================= */

.box.shake {
    animation: shake .75s ease-in-out;
}

@keyframes shake {

    0% {
        transform: translateX(-50%) rotate(0);
    }

    15% {
        transform: translateX(calc(-50% - 13px)) rotate(-5deg);
    }

    30% {
        transform: translateX(calc(-50% + 13px)) rotate(5deg);
    }

    45% {
        transform: translateX(calc(-50% - 12px)) rotate(-5deg);
    }

    60% {
        transform: translateX(calc(-50% + 12px)) rotate(5deg);
    }

    75% {
        transform: translateX(calc(-50% - 6px)) rotate(-2deg);
    }

    100% {
        transform: translateX(-50%) rotate(0);
    }
}

/* ================= STARS ================= */

.star {
    position: absolute;

    left: 50%;
    top: calc(100% - 170px);

    width: 7px;
    height: 7px;

    background: white;

    clip-path: polygon(
        50% 0%,
        62% 38%,
        100% 50%,
        62% 62%,
        50% 100%,
        38% 62%,
        0% 50%,
        38% 38%
    );

    opacity: 0;

    z-index: 30;

    --random-x: 0px;
    --random-y: 0px;
}

/* Explosion */

.explode .star {
    opacity: 1;

    animation:
        starExplosion 1.2s
        cubic-bezier(.1,.7,.2,1)
        forwards;
}

@keyframes starExplosion {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    100% {
        transform:
            translate(
                var(--random-x),
                var(--random-y)
            )
            scale(1.2);
    }
}

/* ================= FORM SENTENCE ================= */

.formSentence .star {
    animation:
        formText 2.5s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes formText {

    0% {
        transform:
            translate(
                var(--random-x),
                var(--random-y)
            )
            scale(1.2);
    }

    100% {
        transform:
            translate(
                var(--text-x),
                var(--text-y)
            )
            scale(.9);
    }
}

/* ================= CAMERA ================= */

.zoom {
    animation:
        cameraZoom 3s
        cubic-bezier(.2,.7,.2,1)
        forwards;
}

@keyframes cameraZoom {

    0% {
        transform: scale(1);
    }

    100% {
        transform: scale(1.35);
    }
}

</style>
</head>


<body>

<div class="scene" id="scene">

    <!-- BUILDING -->

    <div class="building">

        <div class="window" style="left:8%;top:12%;"></div>
        <div class="window" style="left:23%;top:20%;"></div>
        <div class="window" style="left:75%;top:13%;"></div>
        <div class="window" style="left:88%;top:27%;"></div>
        <div class="window" style="left:10%;top:55%;"></div>
        <div class="window" style="left:82%;top:58%;"></div>

    </div>

    <!-- GROUND -->

    <div class="ground">

        <div class="crack"
             style="width:150px;left:10%;top:40%;transform:rotate(20deg)">
        </div>

        <div class="crack"
             style="width:100px;left:70%;top:25%;transform:rotate(-15deg)">
        </div>

        <div class="crack"
             style="width:180px;left:45%;top:70%;transform:rotate(5deg)">
        </div>

    </div>

    <!-- ENTRANCE -->

    <div class="entrance" id="entrance">

        <div class="frame"></div>

        <div class="inside"></div>

        <div class="door leftDoor"></div>
        <div class="door rightDoor"></div>

    </div>


    <!-- BOX -->

    <div class="box" id="box">

        <div class="boxTop"></div>

        <div class="boxBottom"></div>

        <div class="button"></div>

    </div>


    <!-- STARS -->

    <div id="stars"></div>

</div>


<script>

/* ================= SETUP ================= */

const entrance =
    document.getElementById("entrance");

const box =
    document.getElementById("box");

const scene =
    document.getElementById("scene");

const stars =
    document.getElementById("stars");


/* ================= CREATE STARS ================= */

const starCount = 120;

for (let i = 0; i < starCount; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    /*
       Explosion destinations
    */

    const x =
        (Math.random() * 900) - 450;

    const y =
        (Math.random() * 600) - 300;

    star.style.setProperty(
        "--random-x",
        x + "px"
    );

    star.style.setProperty(
        "--random-y",
        y + "px"
    );


    /*
       Text position.

       Stars are distributed across
       the approximate shape of:

       "Quadro Bro's"
    */

    const textWidth = 520;

    const textX =
        (Math.random() - .5) * textWidth;

    const textY =
        (Math.random() - .5) * 100;

    star.style.setProperty(
        "--text-x",
        textX + "px"
    );

    star.style.setProperty(
        "--text-y",
        textY + "px"
    );

    stars.appendChild(star);
}


/* ================= DOORS ================= */

/*
   Doors open from the floor.
*/

setTimeout(() => {

    entrance.classList.add("open");

    scene.classList.add("zoom");

}, 900);


/* ================= BOX ================= */

/*
   Box appears after doors open.
*/

setTimeout(() => {

    box.classList.add("show");

}, 2400);


/* ================= SHAKE 4 TIMES ================= */

setTimeout(() => {

    let shakes = 0;

    const interval =
        setInterval(() => {

            box.classList.remove("shake");

            /*
               Force browser to restart animation.
            */

            void box.offsetWidth;

            box.classList.add("shake");

            shakes++;

            if (shakes >= 4) {

                clearInterval(interval);

            }

        }, 850);

}, 3300);


/* ================= EXPLOSION ================= */

/*
   Stars come OUT OF THE BOX immediately.
*/

setTimeout(() => {

    box.style.opacity = "0";

    stars.classList.add("explode");

}, 6800);


/* ================= WAIT 3 SECONDS ================= */

/*
   After the stars have exploded,
   wait 3 seconds before forming the words.
*/

setTimeout(() => {

    stars.classList.add("formSentence");

}, 10000);

</script>

</body>
</html>
