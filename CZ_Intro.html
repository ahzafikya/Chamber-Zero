<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quadro Bro's</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}


/* =====================================================
   MAIN SCREEN
===================================================== */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}


/* =====================================================
   CAMERA WORLD
   ONLY THE BUILDING + DOORS ARE INSIDE THIS
===================================================== */

.camera {
    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    transform-origin: 50% 50%;

    transform: scale(1);

    transition:
        transform 3s
        cubic-bezier(.65,0,.15,1);

    z-index: 1;
}


/* =====================================================
   BUILDING
===================================================== */

.building {
    position: absolute;

    width: 100%;
    height: 85%;

    left: 0;
    top: 0;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border-bottom: 10px solid #080808;
}


/* Concrete texture */

.building::after {

    content: "";

    position: absolute;

    inset: 0;

    opacity: .12;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 10px,
            #aaa 11px,
            transparent 12px
        );
}


/* =====================================================
   GROUND
===================================================== */

.ground {

    position: absolute;

    width: 100%;
    height: 25%;

    bottom: 0;
    left: 0;

    background:
        linear-gradient(
            #181818,
            #050505
        );
}


/* =====================================================
   DOORWAY
===================================================== */

.entrance {

    position: absolute;

    width: 430px;
    height: 530px;

    left: 50%;
    top: 16%;

    transform:
        translateX(-50%);

    background: #030303;

    box-shadow:
        0 0 60px #000,
        inset 0 0 40px #000;

    z-index: 5;
}


/* =====================================================
   DOORS
===================================================== */

.door {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            135deg,
            #292929,
            #080808
        );

    border: 5px solid #383838;

    transition:
        transform 2s
        cubic-bezier(.7,0,.15,1);

    z-index: 10;
}


.door.left {

    left: 0;

    transform-origin:
        left center;
}


.door.right {

    right: 0;

    transform-origin:
        right center;
}


/* =====================================================
   OPEN DOORS
===================================================== */

.doors-open .door.left {

    transform:
        perspective(900px)
        rotateY(-110deg);
}


.doors-open .door.right {

    transform:
        perspective(900px)
        rotateY(110deg);
}


/* =====================================================
   DOOR DETAILS
===================================================== */

.door::before {

    content: "";

    position: absolute;

    inset: 20px;

    border: 2px solid #444;
}


.handle {

    position: absolute;

    width: 12px;
    height: 55px;

    top: 50%;

    transform:
        translateY(-50%);

    background: #777;

    border-radius: 5px;
}


.left .handle {

    right: 15px;
}


.right .handle {

    left: 15px;
}


/* =====================================================
   EFFECT LAYER
   THIS IS NOT ZOOMED
===================================================== */

.effects {

    position: absolute;

    inset: 0;

    z-index: 100;

    pointer-events: none;
}


/* =====================================================
   SQUARE BOX
===================================================== */

.box {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 110px;
    height: 110px;

    transform:
        translate(-50%, -50%)
        scale(0);

    display: none;

    z-index: 110;
}


/* TOP BLACK */

.box-top {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 50%;

    background: #050505;

    border:
        4px solid #555;
}


/* BOTTOM WHITE */

.box-bottom {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    background: #eee;

    border:
        4px solid #555;
}


/* CENTER BUTTON */

.button {

    position: absolute;

    width: 28px;
    height: 28px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #888;

    border:
        4px solid #444;

    z-index: 5;
}


/* =====================================================
   BOX SPAWN
===================================================== */

.box.spawn {

    display: block;

    animation:
        boxAppear
        .7s
        cubic-bezier(.2,.9,.2,1)
        forwards;
}


@keyframes boxAppear {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =====================================================
   SHAKE 1
===================================================== */

.box.shake1 {

    animation:
        shake1
        .25s
        ease-in-out;
}


@keyframes shake1 {

    0% {
        transform:
            translate(-50%, -50%);
    }

    25% {
        transform:
            translate(
                calc(-50% - 12px),
                -50%
            )
            rotate(-6deg);
    }

    75% {
        transform:
            translate(
                calc(-50% + 12px),
                -50%
            )
            rotate(6deg);
    }

    100% {
        transform:
            translate(-50%, -50%);
    }
}


/* =====================================================
   SHAKE 2
===================================================== */

.box.shake2 {

    animation:
        shake2
        .25s
        ease-in-out;
}


@keyframes shake2 {

    0% {
        transform:
            translate(-50%, -50%);
    }

    25% {
        transform:
            translate(
                calc(-50% - 16px),
                -50%
            )
            rotate(-9deg);
    }

    75% {
        transform:
            translate(
                calc(-50% + 16px),
                -50%
            )
            rotate(9deg);
    }

    100% {
        transform:
            translate(-50%, -50%);
    }
}


/* =====================================================
   SHAKE 3
===================================================== */

.box.shake3 {

    animation:
        shake3
        .25s
        ease-in-out;
}


@keyframes shake3 {

    0% {
        transform:
            translate(-50%, -50%);
    }

    25% {
        transform:
            translate(
                calc(-50% - 20px),
                -50%
            )
            rotate(-12deg);
    }

    75% {
        transform:
            translate(
                calc(-50% + 20px),
                -50%
            )
            rotate(12deg);
    }

    100% {
        transform:
            translate(-50%, -50%);
    }
}


/* =====================================================
   STARS
===================================================== */

.stars {

    position: absolute;

    inset: 0;

    z-index: 120;

    pointer-events: none;
}


.star {

    position: absolute;

    width: 7px;
    height: 7px;

    left: 50%;
    top: 50%;

    opacity: 0;

    background: white;

    clip-path:
        polygon(
            50% 0%,
            61% 38%,
            100% 50%,
            61% 62%,
            50% 100%,
            39% 62%,
            0% 50%,
            39% 38%
        );

    transform:
        translate(-50%, -50%)
        scale(.2);
}


/* =====================================================
   STAR EXPLOSION
===================================================== */

.star.explode {

    animation:
        explosion
        1.2s
        cubic-bezier(.1,.8,.2,1)
        forwards;
}


@keyframes explosion {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    100% {

        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--explode-x)),
                calc(-50% + var(--explode-y))
            )
            scale(1);
    }
}


/* =====================================================
   FORM THE ACTUAL WORD
===================================================== */

.star.form {

    animation:
        formText
        2s
        cubic-bezier(.65,0,.15,1)
        forwards;
}


@keyframes formText {

    0% {

        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--explode-x)),
                calc(-50% + var(--explode-y))
            )
            scale(1);
    }

    100% {

        opacity: 1;

        transform:
            translate(
                calc(-50% + var(--target-x)),
                calc(-50% + var(--target-y))
            )
            scale(.9);
    }
}

</style>
</head>


<body>

<div class="scene">


    <!-- =================================================
         CAMERA
    ================================================== -->

    <div class="camera">

        <div class="building"></div>

        <div class="ground"></div>


        <div class="entrance" id="entrance">

            <div class="door left">

                <div class="handle"></div>

            </div>


            <div class="door right">

                <div class="handle"></div>

            </div>

        </div>

    </div>



    <!-- =================================================
         EFFECTS
         DOES NOT ZOOM
    ================================================== -->

    <div class="effects">


        <!-- SQUARE BOX -->

        <div class="box" id="box">

            <div class="box-top"></div>

            <div class="box-bottom"></div>

            <div class="button"></div>

        </div>


        <!-- STARS -->

        <div
            class="stars"
            id="stars"
        ></div>


    </div>

</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const camera =
    document.querySelector(".camera");

const entrance =
    document.querySelector("#entrance");

const box =
    document.querySelector("#box");

const starsContainer =
    document.querySelector("#stars");


/* =====================================================
   1. FULL ZOOM INTO THE MIDDLE OF THE DOOR
===================================================== */

setTimeout(() => {

    camera.style.transform =
        "scale(3.2)";

}, 300);


/* =====================================================
   2. DOORS OPEN
===================================================== */

setTimeout(() => {

    entrance.classList.add(
        "doors-open"
    );

}, 2300);


/* =====================================================
   CREATE TEXT CANVAS
===================================================== */

const canvas =
    document.createElement("canvas");

const ctx =
    canvas.getContext("2d");


canvas.width =
    window.innerWidth;

canvas.height =
    window.innerHeight;


/* =====================================================
   TEXT
   EXACTLY:
   Quadro Bro's
===================================================== */

const fontSize =
    Math.min(
        window.innerWidth * 0.12,
        145
    );


ctx.font =
    `900 ${fontSize}px Arial`;

ctx.textAlign =
    "center";

ctx.textBaseline =
    "middle";

ctx.fillStyle =
    "white";


ctx.fillText(
    "Quadro Bro's",
    canvas.width / 2,
    canvas.height / 2
);


/* =====================================================
   GET THE REAL LETTER PIXELS
===================================================== */

const image =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );


const pixels = [];


/*
   Every white pixel becomes a possible
   destination for a star.
*/

for (
    let y = 0;
    y < canvas.height;
    y += 4
) {

    for (
        let x = 0;
        x < canvas.width;
        x += 4
    ) {

        const index =
            (y * canvas.width + x) * 4;


        const alpha =
            image.data[index + 3];


        if (alpha > 100) {

            pixels.push({

                x:
                    x -
                    canvas.width / 2,

                y:
                    y -
                    canvas.height / 2

            });

        }

    }

}


/* =====================================================
   CREATE 1000 STARS
===================================================== */

const STAR_COUNT = 1000;

const stars = [];


for (
    let i = 0;
    i < STAR_COUNT;
    i++
) {

    const star =
        document.createElement("div");


    star.className =
        "star";


    /* ---------------------------------------------
       REAL LETTER DESTINATION
    --------------------------------------------- */

    const target =
        pixels[
            i % pixels.length
        ];


    star.style.setProperty(
        "--target-x",
        `${target.x}px`
    );


    star.style.setProperty(
        "--target-y",
        `${target.y}px`
    );


    /* ---------------------------------------------
       EXPLOSION DIRECTION
    --------------------------------------------- */

    const angle =
        Math.random() *
        Math.PI *
        2;


    const distance =
        120 +
        Math.random() *
        500;


    const explodeX =
        Math.cos(angle) *
        distance;


    const explodeY =
        Math.sin(angle) *
        distance;


    star.style.setProperty(
        "--explode-x",
        `${explodeX}px`
    );


    star.style.setProperty(
        "--explode-y",
        `${explodeY}px`
    );


    starsContainer.appendChild(
        star
    );


    stars.push(
        star
    );

}


/* =====================================================
   3. BOX SPAWNS
   THE CAMERA IS ALREADY ZOOMED
===================================================== */

setTimeout(() => {

    box.classList.add(
        "spawn"
    );

}, 3600);


/* =====================================================
   4. SHAKE #1
===================================================== */

setTimeout(() => {

    box.classList.remove(
        "spawn"
    );

    box.classList.add(
        "shake1"
    );

}, 4500);


/* =====================================================
   5. SHAKE #2
===================================================== */

setTimeout(() => {

    box.classList.remove(
        "shake1"
    );

    box.classList.add(
        "shake2"
    );

}, 5100);


/* =====================================================
   6. SHAKE #3
===================================================== */

setTimeout(() => {

    box.classList.remove(
        "shake2"
    );

    box.classList.add(
        "shake3"
    );

}, 5700);


/* =====================================================
   7. BURST FROM THE BOX
===================================================== */

setTimeout(() => {

    /*
       Hide the box AFTER the burst starts.
    */

    box.style.display =
        "none";


    stars.forEach(
        (star, index) => {

            /*
               Tiny delay between stars
               makes the burst feel natural.
            */

            setTimeout(() => {

                star.classList.add(
                    "explode"
                );

            }, Math.random() * 120);

        }
    );


}, 6100);


/* =====================================================
   8. EXACTLY 2 SECONDS AFTER BURST
   STARS FORM "Quadro Bro's"
===================================================== */

setTimeout(() => {

    stars.forEach(
        (star, index) => {

            setTimeout(() => {

                star.classList.remove(
                    "explode"
                );


                star.classList.add(
                    "form"
                );

            }, Math.random() * 400);

        }
    );


}, 8100);


</script>

</body>
</html>
