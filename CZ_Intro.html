<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chamber Zero</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}


/* ==================================================
   CAMERA
================================================== */

.camera {
    position: absolute;
    inset: 0;

    transform-origin: 50% 50%;
    transform: scale(1);

    transition:
        transform 3.2s cubic-bezier(.65,0,.15,1);

    z-index: 1;

    perspective: 1400px;
}


/* ==================================================
   WALL / BUILDING
================================================== */

.building {
    position: absolute;
    inset: 0;

    background-color: #101010;

    background-image:

        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 47px,
            #050505 48px,
            #050505 51px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 94px,
            #070707 95px,
            #070707 99px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 94px,
            rgba(0,0,0,.7) 95px,
            rgba(0,0,0,.7) 99px
        ),

        radial-gradient(
            ellipse at 50% 35%,
            #343434 0%,
            #202020 38%,
            #111 72%,
            #050505 100%
        );

    background-size:
        auto,
        99px 51px,
        99px 102px,
        auto;

    background-position:
        0 0,
        0 0,
        49px 51px,
        0 0;

    box-shadow:
        inset 0 0 180px #000,
        inset 0 -80px 120px #000;
}


.building::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 5px
        );

    opacity: .45;

    pointer-events: none;
}


/* ==================================================
   FLOOR
   FIXED TO THE BOTTOM OF THE DOORWAY
================================================== */

.ground {
    position: absolute;

    left: -15%;
    top: calc(16% + 530px);

    width: 130%;
    height: 75%;

    background-color: #090909;

    background-image:

        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 54px,
            #020202 55px,
            #020202 59px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 105px,
            #020202 106px,
            #020202 111px
        ),

        linear-gradient(
            to bottom,
            #181818 0%,
            #0d0d0d 30%,
            #050505 70%,
            #010101 100%
        );

    background-size:
        auto,
        111px 110px,
        auto;

    background-position:
        0 0,
        0 0,
        0 0;

    transform:
        perspective(600px)
        rotateX(62deg);

    transform-origin: top center;

    box-shadow:
        inset 0 45px 80px rgba(0,0,0,.85),
        0 -15px 70px #000;

    z-index: 2;
}


/* ==================================================
   DOORWAY THRESHOLD
================================================== */

.threshold {
    position: absolute;

    left: 50%;

    top: calc(16% + 530px - 12px);

    width: 470px;
    height: 42px;

    transform:
        translateX(-50%)
        perspective(600px)
        rotateX(62deg);

    transform-origin: top center;

    background:
        linear-gradient(
            to bottom,
            #191919,
            #080808
        );

    border-top:
        3px solid #252525;

    border-left:
        2px solid #050505;

    border-right:
        2px solid #050505;

    box-shadow:
        0 8px 25px rgba(0,0,0,.9),
        inset 0 5px 10px rgba(255,255,255,.025);

    z-index: 4;
}


/* ==================================================
   ENTRANCE
================================================== */

.entrance {
    position: absolute;

    width: 430px;
    height: 530px;

    left: 50%;
    top: 16%;

    transform:
        translateX(-50%);

    background: #030303;

    box-shadow:
        0 0 80px #000,
        inset 0 0 50px #000;

    overflow: visible;

    transform-style: preserve-3d;

    z-index: 5;
}


.entrance::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            #151515 0%,
            #050505 55%,
            #000 100%
        );

    box-shadow:
        inset 0 0 80px #000;

    z-index: 0;

    pointer-events: none;
}


/* ==================================================
   DOORS
================================================== */

.door {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #090909,
            #222,
            #111,
            #050505
        );

    border: 2px solid #050505;

    transition:
        transform 1.9s cubic-bezier(.65,0,.18,1);

    z-index: 5;

    transform-style: preserve-3d;

    box-shadow:
        0 0 18px rgba(0,0,0,.8);
}

.door.left {
    left: 0;

    transform-origin:
        left center;
}

.door.right {
    right: 0;

    transform-origin:
        right center;
}


.door::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 2px,
            transparent 2px,
            transparent 8px
        );

    pointer-events: none;
}


.door::before {
    content: "";

    position: absolute;

    left: 10%;
    right: 10%;
    top: 8%;
    bottom: 8%;

    border: 2px solid #050505;

    background:
        linear-gradient(
            135deg,
            #252525,
            #111 45%,
            #080808
        );

    box-shadow:
        inset 0 0 20px #000;

    pointer-events: none;
}


.door .handle::before {
    content: "";

    position: absolute;

    width: 60%;
    height: 70%;

    left: 20%;
    top: 15%;

    border: 1px solid #333;

    box-shadow:
        inset 0 0 10px #000;
}


/* ==================================================
   HANDLES
================================================== */

.handle {
    position: absolute;

    top: 50%;

    width: 13px;
    height: 55px;

    transform: translateY(-50%);

    background:
        linear-gradient(
            90deg,
            #444,
            #999,
            #444
        );

    border-radius: 5px;

    box-shadow:
        0 0 10px #aaa,
        inset 0 0 5px #111;

    z-index: 10;
}

.left .handle {
    right: 15px;
}

.right .handle {
    left: 15px;
}


/* ==================================================
   DOOR PULL OUTWARD
================================================== */

.entrance.doors-open .left {

    transform:
        translateZ(90px)
        perspective(900px)
        rotateY(-105deg)
        translateX(-25px);
}

.entrance.doors-open .right {

    transform:
        translateZ(90px)
        perspective(900px)
        rotateY(105deg)
        translateX(25px);
}


/* ==================================================
   EFFECTS
================================================== */

.effects {
    position: absolute;
    inset: 0;

    z-index: 100;

    pointer-events: none;
}


/* ==================================================
   CHEST
================================================== */

.box {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 150px;
    height: 125px;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 110;

    /*
       Prevents accidental visual flickering
       from rendering/compositing changes.
    */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


/* ==================================================
   CHEST TOP
================================================== */

.box-top {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #222,
            #050505
        );

    border-radius:
        16px 16px 0 0;

    border: 3px solid #000;

    box-shadow:
        inset 0 5px 10px rgba(255,255,255,.05);
}


/* ==================================================
   CHEST BOTTOM
================================================== */

.box-bottom {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    background:
        linear-gradient(
            135deg,
            #eee,
            #999,
            #777
        );

    border-radius:
        0 0 16px 16px;

    border: 3px solid #000;

    box-shadow:
        inset 0 -5px 10px rgba(0,0,0,.25);
}


/* ==================================================
   BUTTON
================================================== */

.button {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 36px;
    height: 36px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #eee,
            #999 45%,
            #555
        );

    border: 5px solid #333;

    box-shadow:
        inset 0 0 8px #fff,
        0 0 12px #000;

    z-index: 10;
}


/* ==================================================
   CHEST APPEAR
================================================== */

.box.appear {
    opacity: 1;

    animation:
        boxAppear .7s
        cubic-bezier(.2,1.4,.4,1)
        forwards;
}

@keyframes boxAppear {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    70% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.15);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

}


/* ==================================================
   EXACTLY 3 SHAKES
   NO FLICKER
================================================== */

.box.shake1 {
    opacity: 1;

    animation:
        shakeOne .32s ease-in-out forwards;
}

.box.shake2 {
    opacity: 1;

    animation:
        shakeTwo .32s ease-in-out forwards;
}

.box.shake3 {
    opacity: 1;

    animation:
        shakeThree .32s ease-in-out forwards;
}


@keyframes shakeOne {

    0%,100% {
        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
    }

    25% {
        transform:
            translate(calc(-50% - 10px), -50%)
            scale(1)
            rotate(-5deg);
    }

    50% {
        transform:
            translate(calc(-50% + 10px), -50%)
            scale(1)
            rotate(5deg);
    }

    75% {
        transform:
            translate(calc(-50% - 7px), -50%)
            scale(1)
            rotate(-3deg);
    }

}


@keyframes shakeTwo {

    0%,100% {
        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
    }

    25% {
        transform:
            translate(calc(-50% + 11px), -50%)
            scale(1)
            rotate(5deg);
    }

    50% {
        transform:
            translate(calc(-50% - 11px), -50%)
            scale(1)
            rotate(-5deg);
    }

    75% {
        transform:
            translate(calc(-50% + 7px), -50%)
            scale(1)
            rotate(3deg);
    }

}


@keyframes shakeThree {

    0%,100% {
        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
    }

    25% {
        transform:
            translate(calc(-50% - 12px), -50%)
            scale(1)
            rotate(-6deg);
    }

    50% {
        transform:
            translate(calc(-50% + 12px), -50%)
            scale(1)
            rotate(6deg);
    }

    75% {
        transform:
            translate(calc(-50% - 6px), -50%)
            scale(1)
            rotate(-3deg);
    }

}


/* ==================================================
   STAR CANVAS
================================================== */

#starCanvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 120;

    pointer-events: none;
}

</style>
</head>


<body>

<div class="scene">

    <div class="camera">

        <div class="building"></div>

        <div class="ground"></div>

        <div class="threshold"></div>

        <div class="entrance" id="entrance">

            <div class="door left">
                <div class="handle"></div>
            </div>

            <div class="door right">
                <div class="handle"></div>
            </div>

        </div>

    </div>


    <div class="effects">

        <div class="box" id="box">

            <div class="box-top"></div>

            <div class="box-bottom"></div>

            <div class="button"></div>

        </div>

        <canvas id="starCanvas"></canvas>

    </div>

</div>


<script>

/* ==================================================
   ELEMENTS
================================================== */

const camera =
    document.querySelector(".camera");

const entrance =
    document.querySelector("#entrance");

const box =
    document.querySelector("#box");

const canvas =
    document.querySelector("#starCanvas");

const ctx =
    canvas.getContext("2d");


let width =
    window.innerWidth;

let height =
    window.innerHeight;


canvas.width = width;
canvas.height = height;


/* ==================================================
   STAR SETTINGS
================================================== */

const STAR_COUNT = 1200;

const stars = [];


/* ==================================================
   CREATE TEXT STAR MAP
================================================== */

function createTextTargets() {

    const textCanvas =
        document.createElement("canvas");

    const textCtx =
        textCanvas.getContext("2d");


    textCanvas.width = width;
    textCanvas.height = height;


    const fontSize =
        Math.min(
            width * 0.085,
            115
        );


    textCtx.font =
        `900 ${fontSize}px Arial`;

    textCtx.textAlign =
        "center";

    textCtx.textBaseline =
        "middle";

    textCtx.fillStyle =
        "#ffffff";


    textCtx.fillText(
        "Chamber Zero",
        width / 2,
        height / 2
    );


    const image =
        textCtx.getImageData(
            0,
            0,
            width,
            height
        );


    const pixels =
        image.data;


    const points = [];


    for (
        let y = 0;
        y < height;
        y += 3
    ) {

        for (
            let x = 0;
            x < width;
            x += 3
        ) {

            const index =
                (y * width + x) * 4;


            if (
                pixels[index + 3] > 100
            ) {

                points.push({
                    x,
                    y
                });

            }

        }

    }


    for (
        let i = points.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            points[i],
            points[j]
        ] =
        [
            points[j],
            points[i]
        ];

    }


    return points;

}


/* ==================================================
   CREATE STARS
================================================== */

let targets =
    createTextTargets();


function createStars() {

    stars.length = 0;


    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            80 +
            Math.random() *
            500;


        const target =
            targets[
                i % targets.length
            ];


        stars.push({

            explosionX:
                Math.cos(angle) *
                distance,

            explosionY:
                Math.sin(angle) *
                distance,

            targetX:
                target.x -
                width / 2,

            targetY:
                target.y -
                height / 2,

            size:
                1.3 +
                Math.random() * 2.4

        });

    }

}


createStars();


/* ==================================================
   DRAW STAR
================================================== */

function drawStar(
    x,
    y,
    size
) {

    ctx.moveTo(
        x,
        y - size * 2
    );

    ctx.lineTo(
        x + size * .45,
        y - size * .45
    );

    ctx.lineTo(
        x + size * 2,
        y
    );

    ctx.lineTo(
        x + size * .45,
        y + size * .45
    );

    ctx.lineTo(
        x,
        y + size * 2
    );

    ctx.lineTo(
        x - size * .45,
        y + size * .45
    );

    ctx.lineTo(
        x - size * 2,
        y
    );

    ctx.lineTo(
        x - size * .45,
        y - size * .45
    );

    ctx.closePath();

}


/* ==================================================
   EXPLOSION
================================================== */

let animationStart = 0;

let animationRunning = false;


function startExplosion() {

    animationRunning = true;

    animationStart =
        performance.now();

    requestAnimationFrame(
        animateStars
    );

}


function animateStars(now) {

    if (!animationRunning)
        return;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const elapsed =
        now - animationStart;


    ctx.fillStyle =
        "#ffffff";


    /* ==================================================
       0 - 1.2 SEC
       EXPLOSION
    ================================================== */

    if (elapsed < 1200) {

        const progress =
            elapsed / 1200;


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        ctx.beginPath();


        for (const star of stars) {

            const x =
                width / 2 +
                star.explosionX *
                eased;


            const y =
                height / 2 +
                star.explosionY *
                eased;


            drawStar(
                x,
                y,
                star.size
            );

        }


        ctx.fill();

    }


    /* ==================================================
       1.2 - 2.2 SEC
       EXACTLY 1 SECOND WAIT
    ================================================== */

    else if (elapsed < 2200) {

        ctx.beginPath();


        for (const star of stars) {

            const x =
                width / 2 +
                star.explosionX;


            const y =
                height / 2 +
                star.explosionY;


            drawStar(
                x,
                y,
                star.size
            );

        }


        ctx.fill();

    }


    /* ==================================================
       2.2+ SEC
       FORM CHAMBER ZERO
    ================================================== */

    else {

        const formElapsed =
            elapsed - 2200;


        const duration =
            2600;


        const progress =
            Math.min(
                formElapsed /
                duration,
                1
            );


        const eased =
            progress *
            progress *
            (3 - 2 * progress);


        ctx.beginPath();


        for (const star of stars) {

            const startX =
                width / 2 +
                star.explosionX;


            const startY =
                height / 2 +
                star.explosionY;


            const targetX =
                width / 2 +
                star.targetX;


            const targetY =
                height / 2 +
                star.targetY;


            const x =
                startX +
                (targetX - startX) *
                eased;


            const y =
                startY +
                (targetY - startY) *
                eased;


            drawStar(
                x,
                y,
                star.size
            );

        }


        ctx.fill();

    }


    requestAnimationFrame(
        animateStars
    );

}


/* ==================================================
   TIMELINE
================================================== */


/*
   0.3 SEC:
   START ZOOM
*/

setTimeout(() => {

    camera.style.transform =
        "scale(3.2)";


    entrance.classList.add(
        "doors-open"
    );

}, 300);


/*
   CHEST APPEARS MID-ZOOM
*/

setTimeout(() => {

    box.classList.add(
        "appear"
    );

}, 1500);


/*
   SHAKE 1

   IMPORTANT:
   We DO NOT remove .appear here.
   This prevents the box from briefly
   returning to scale(0).
*/

setTimeout(() => {

    box.classList.add(
        "shake1"
    );

}, 2500);


/*
   SHAKE 2
*/

setTimeout(() => {

    box.classList.remove(
        "shake1"
    );

    void box.offsetWidth;

    box.classList.add(
        "shake2"
    );

}, 3100);


/*
   SHAKE 3
*/

setTimeout(() => {

    box.classList.remove(
        "shake2"
    );

    void box.offsetWidth;

    box.classList.add(
        "shake3"
    );

}, 3700);


/*
   BURST
*/

setTimeout(() => {

    box.style.opacity = "0";

    startExplosion();

}, 4300);


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
    "resize",
    () => {

        width =
            window.innerWidth;

        height =
            window.innerHeight;


        canvas.width =
            width;

        canvas.height =
            height;


        targets =
            createTextTargets();


        stars.forEach(
            (star, i) => {

                const target =
                    targets[
                        i %
                        targets.length
                    ];


                star.targetX =
                    target.x -
                    width / 2;


                star.targetY =
                    target.y -
                    height / 2;

            }
        );

    }
);

</script>

</body>
</html>
